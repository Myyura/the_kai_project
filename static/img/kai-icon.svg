  <title id="kai-title">Kai — 42</title>
  <desc id="kai-description">Editable vector logo. The gold edge of the lowercase a and keyhole suggest 4; a continuous river of light suggests 2. Ink-navy rounded square with transparent exterior corners. All shapes are vector paths and gradients; no embedded raster or fonts.</desc>
