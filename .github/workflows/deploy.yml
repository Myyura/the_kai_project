name: 部署到 GitHub Pages

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
    # 如果你想要进一步定义触发、路径以及其他内容，请检阅 Github Actions 文档
    # https://docs.github.com/zh/actions/using-workflows/workflow-syntax-for-github-actions#on

concurrency:
  group: pages-${{ github.ref }}
  # Superseded PR checks can stop, while production deployments stay serialized.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: 构建 Rspress
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: 安装依赖
        run: yarn install --frozen-lockfile
      - name: 校验 API 数据
        run: yarn api:validate
      - name: 运行自动化测试
        run: yarn test
      - name: 记录构建资源
        run: |
          free -h
          df -h /
          du -sh node_modules
      - name: 构建网站
        shell: bash
        run: |
          set -euo pipefail
          (
            while sleep 60; do
              echo "::group::构建资源 $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              free -h
              df -h /
              ps -eo pid,ppid,rss,%mem,%cpu,comm --sort=-rss | awk 'NR <= 12'
              if [ -r /sys/fs/cgroup/memory.current ]; then
                printf 'cgroup memory.current: '
                cat /sys/fs/cgroup/memory.current
                if [ -r /sys/fs/cgroup/memory.stat ]; then
                  cgroup_current=$(< /sys/fs/cgroup/memory.current)
                  cgroup_inactive=$(awk '$1 == "inactive_file" { print $2 }' /sys/fs/cgroup/memory.stat)
                  if [[ "$cgroup_current" =~ ^[0-9]+$ && "$cgroup_inactive" =~ ^[0-9]+$ ]] \
                    && ((cgroup_inactive <= cgroup_current)); then
                    printf 'cgroup working set: %s\n' "$((cgroup_current - cgroup_inactive))"
                  fi
                fi
              fi
              echo '::endgroup::'
            done
          ) &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
          /usr/bin/time -v yarn build:pages
        env:
          # Pages uses its dedicated Rspress build profile. The 16 GiB hard guard
          # belongs to local builds and is deliberately not applied here.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          HCAPTCHA_SITE_KEY: ${{ secrets.HCAPTCHA_SITE_KEY }}
          PROBLEM_SETS_ENABLED: 'true'
          GITHUB_TOKEN: ${{ github.token }}
      - name: 检查 Pages 构建入口
        run: |
          test -f build/index.html
          test -f build/content-export/v1/kai-content-v1.json.gz
          test ! -d build/ja
          test ! -d build/en
          test ! -f build/progress.html
      - name: 上传构建制品
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    name: 部署到 GitHub Pages
    needs: build
    if: github.event_name == 'push'

    # 给予 GITHUB_TOKEN 进行 Pages 部署所必须的权限
    permissions:
      pages: write # 以部署到 Pages
      id-token: write # 以验证部署来自恰当的源

    # 部署到 Github Pages 环境
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  backend:
    name: 迁移 Supabase 并部署 Edge Functions
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.109.1
      - name: 迁移数据库并部署函数
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF are required for a production deployment."
            exit 1
          fi
          if compgen -G 'supabase/migrations/*.sql' > /dev/null; then
            if [ -z "$SUPABASE_DB_PASSWORD" ]; then
              echo "::error::SUPABASE_DB_PASSWORD is required when pending database migrations exist."
              exit 1
            fi
            supabase link --project-ref "$SUPABASE_PROJECT_REF"
            supabase db push --linked --include-all --dry-run
            supabase db push --linked --include-all
          else
            echo "No pending database migrations; using the consolidated production baseline."
          fi
          supabase functions deploy developer-api-keys --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy kai-api --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy content-submissions --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy agent-session --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy agent-context --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # `yarn catalog:sync` is intentionally run by a maintainer from a trusted
      # workstation after deployment. It syncs identities and discovery
      # metadata only; Markdown bodies ship with the Pages artifact.
