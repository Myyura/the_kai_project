name: 部署到 GitHub Pages

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
    # 如果你想要进一步定义触发、路径以及其他内容，请检阅 Github Actions 文档
    # https://docs.github.com/zh/actions/using-workflows/workflow-syntax-for-github-actions#on

concurrency:
  group: pages-${{ github.ref }}
  # Superseded PR checks can stop, while production deployments stay serialized.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: 构建 Docusaurus
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: 安装依赖
        run: yarn install --frozen-lockfile
      - name: 校验 API 数据
        run: yarn api:validate
      - name: 运行回归测试
        run: yarn test
      - name: 记录构建资源
        run: |
          free -h
          df -h /
          du -sh node_modules
      - name: 构建网站
        shell: bash
        run: |
          set -euo pipefail
          (
            while sleep 60; do
              echo "::group::构建资源 $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              free -h
              df -h /
              ps -eo pid,ppid,rss,%mem,%cpu,comm --sort=-rss | awk 'NR <= 12'
              if [ -r /sys/fs/cgroup/memory.current ]; then
                printf 'cgroup memory.current: '
                cat /sys/fs/cgroup/memory.current
                if [ -r /sys/fs/cgroup/memory.stat ]; then
                  cgroup_current=$(< /sys/fs/cgroup/memory.current)
                  cgroup_inactive=$(awk '$1 == "inactive_file" { print $2 }' /sys/fs/cgroup/memory.stat)
                  if [[ "$cgroup_current" =~ ^[0-9]+$ && "$cgroup_inactive" =~ ^[0-9]+$ ]] \
                    && ((cgroup_inactive <= cgroup_current)); then
                    printf 'cgroup working set: %s\n' "$((cgroup_current - cgroup_inactive))"
                  fi
                fi
              fi
              echo '::endgroup::'
            done
          ) &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
          /usr/bin/time -v yarn build:pages
        env:
          DOCUSAURUS_PERF_LOGGER: 'true'
          # Pages uses school-sharded 8 GiB processes on the public 16 GiB runner.
          # The local parent-process guard is deliberately not applied here.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          HCAPTCHA_SITE_KEY: ${{ secrets.HCAPTCHA_SITE_KEY }}
          PROBLEM_SETS_ENABLED: 'true'
          GITHUB_TOKEN: ${{ github.token }}
      - name: 检查 Pages 构建入口
        run: |
          test -f build/index.html
          test -f build/content-export/v1/kai-content-v1.json.gz
          test ! -d build/ja
          test ! -d build/en
          test ! -f build/progress.html
      - name: 生成同版本题目目录
        run: yarn catalog:export "$RUNNER_TEMP/document-catalog-sync.sql"
      - name: 上传题目目录制品
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: document-catalog
          path: ${{ runner.temp }}/document-catalog-sync.sql
          if-no-files-found: error
          retention-days: 3
      - name: 上传构建制品
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    name: 部署到 GitHub Pages
    # Publish only after the matching catalog is synced and API readers are ready.
    needs: [build, backend]
    if: github.event_name == 'push'

    # 给予 GITHUB_TOKEN 进行 Pages 部署所必须的权限
    permissions:
      pages: write # 以部署到 Pages
      id-token: write # 以验证部署来自恰当的源

    # 部署到 Github Pages 环境
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  backend:
    name: 迁移 Supabase、同步题目目录并部署接口
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: 下载同版本题目目录
        uses: actions/download-artifact@v8
        with:
          name: document-catalog
          path: ${{ runner.temp }}/document-catalog
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.109.1
      - name: 准备数据库同步客户端
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes postgresql-client
          fi
      - name: 迁移数据库
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF and SUPABASE_DB_PASSWORD are required for migrations and catalog sync."
            exit 1
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          if compgen -G 'supabase/migrations/*.sql' > /dev/null; then
            supabase db push --linked --include-all --dry-run
            supabase db push --linked --include-all
          else
            echo "No pending database migrations; using the consolidated production baseline."
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: 同步并校验题目目录
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/document-catalog/document-catalog-sync.sql"
          # CLI 2.109.1 link writes a password-free session-pooler URI here.
          # psql runs the complete transaction; db query --linked uses the HTTP
          # query API, which does not support this multi-statement SQL file.
          test -s supabase/.temp/pooler-url
          catalog_db_url="$(cat supabase/.temp/pooler-url)"
          psql --dbname="$catalog_db_url" --no-psqlrc --no-password \
            --set=ON_ERROR_STOP=1 --quiet \
            --file="$RUNNER_TEMP/document-catalog/document-catalog-sync.sql"
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: '30'
      - name: 部署 Edge Functions
        run: |
          set -euo pipefail
          # Bundle on Supabase to avoid registry rate limits when pulling the
          # local edge-runtime Docker image on shared GitHub-hosted runners.
          supabase functions deploy developer-api-keys --project-ref "$SUPABASE_PROJECT_REF" --use-api
          supabase functions deploy kai-api --project-ref "$SUPABASE_PROJECT_REF" --use-api
          supabase functions deploy content-submissions --project-ref "$SUPABASE_PROJECT_REF" --use-api
          supabase functions deploy agent-session --project-ref "$SUPABASE_PROJECT_REF" --use-api
          supabase functions deploy agent-context --project-ref "$SUPABASE_PROJECT_REF" --use-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
